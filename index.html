<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080808">
<title>Kota Snap</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;overflow:hidden}
button{font:inherit;border:0;cursor:pointer;touch-action:manipulation}
.screen{position:fixed;inset:0;display:none;background:#080808}
.screen.active{display:flex}
#home{align-items:center;justify-content:center;text-align:center;padding:24px}
.brand{letter-spacing:5px;font-size:clamp(30px,7vw,54px);font-weight:900;margin-bottom:8px}
.sub{color:#aaa;letter-spacing:2px;font-size:clamp(12px,2.5vw,16px);margin-bottom:42px}
.primary{background:#fff;color:#111;border-radius:999px;padding:18px 42px;min-width:min(78vw,340px);font-size:clamp(20px,4vw,28px);font-weight:900}
.small{background:#222;color:#fff;border:1px solid #444;border-radius:999px;padding:13px 22px;font-weight:800}
#cameraScreen{flex-direction:column}
.cameraWrap{position:relative;flex:1;min-height:0;background:#000;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;display:block}
.topbar{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:max(18px,env(safe-area-inset-top)) 18px 18px;background:linear-gradient(#0009,transparent)}
.logo{font-weight:900;letter-spacing:3px;font-size:16px}
.flip{background:#ffffffdd;color:#111;border-radius:999px;padding:10px 15px;font-weight:900}
.countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(90px,25vw,190px);font-weight:900;text-shadow:0 5px 25px #000;pointer-events:none}
.bottom{padding:14px 20px max(18px,env(safe-area-inset-bottom));background:#080808;text-align:center}
.hint{color:#aaa;font-size:13px;margin-bottom:10px;min-height:18px}
#previewScreen{align-items:center;justify-content:center;padding:20px;flex-direction:column;gap:16px}
.previewTitle{font-weight:900;letter-spacing:2px;font-size:18px}
.previewBox{flex:1;min-height:0;width:min(82vw,520px);display:flex;align-items:center;justify-content:center}
#photo{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
.actions{width:100%;display:flex;gap:12px;justify-content:center;padding-bottom:max(4px,env(safe-area-inset-bottom))}
.actions button{flex:1;max-width:240px}
#doneScreen{align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:28px}
.check{font-size:72px;margin-bottom:14px}.doneTitle{font-size:30px;font-weight:900}.doneText{color:#aaa;margin:10px 0 28px}
</style>
</head>
<body>
<section id="home" class="screen active">
  <div>
    <div class="brand">KOTA SNAP</div>
    <div class="sub">COFFEE • PEOPLE • STORIES</div>
    <button id="startBtn" class="primary">📸 MULA SESI</button>
  </div>
</section>

<section id="cameraScreen" class="screen">
  <div class="cameraWrap">
    <video id="video" autoplay playsinline muted></video>
    <div class="topbar"><div class="logo">KOTA SNAP</div><button id="flipBtn" class="flip">↔ KAMERA</button></div>
    <div id="countdown" class="countdown"></div>
  </div>
  <div class="bottom"><div id="hint" class="hint">Bersedia...</div><button id="captureBtn" class="primary">MULA</button></div>
</section>

<section id="previewScreen" class="screen">
  <div class="previewTitle">PREVIEW FOTO</div>
  <div class="previewBox"><img id="photo" alt="Foto Kota Snap"></div>
  <div class="actions">
    <button id="retakeBtn" class="small">↻ RETAKE</button>
    <button id="useBtn" class="primary">✓ GUNA FOTO</button>
  </div>
</section>

<section id="doneScreen" class="screen">
  <div class="check">✓</div><div class="doneTitle">FOTO DITERIMA</div>
  <div class="doneText">Seterusnya kita sambungkan filter dan template Kota Snap.</div>
  <button id="againBtn" class="small">AMBIL SEMULA</button>
</section>

<script>
const screens={home:document.getElementById('home'),camera:document.getElementById('cameraScreen'),preview:document.getElementById('previewScreen'),done:document.getElementById('doneScreen')};
const video=document.getElementById('video'), countdown=document.getElementById('countdown'), hint=document.getElementById('hint');
const photo=document.getElementById('photo');
let stream=null,facing='user',busy=false;
function show(name){Object.values(screens).forEach(s=>s.classList.remove('active'));screens[name].classList.add('active')}
async function openCamera(){
 if(stream)stream.getTracks().forEach(t=>t.stop());
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream; await video.play(); return true;
 }catch(e){alert('Tak dapat akses kamera. Pastikan Camera = Allow dalam Safari.');return false}
}
async function prepare(){show('camera');hint.textContent='Kamera sedang dibuka...';const ok=await openCamera();if(ok)hint.textContent='Tekan MULA untuk ambil 1 gambar.'}
async function capture(){if(busy)return;busy=true;if(!stream&&!(await openCamera())){busy=false;return}
 document.getElementById('captureBtn').disabled=true;
 for(let n=3;n>=1;n--){countdown.textContent=n;await new Promise(r=>setTimeout(r,700))}
 countdown.textContent='📸';await new Promise(r=>setTimeout(r,250));
 const c=document.createElement('canvas');c.width=video.videoWidth||1280;c.height=video.videoHeight||720;c.getContext('2d').drawImage(video,0,0,c.width,c.height);
 photo.src=c.toDataURL('image/jpeg',.94);countdown.textContent='';show('preview');document.getElementById('captureBtn').disabled=false;busy=false;
}
document.getElementById('startBtn').onclick=prepare;
document.getElementById('captureBtn').onclick=capture;
document.getElementById('flipBtn').onclick=async()=>{if(busy)return;facing=facing==='user'?'environment':'user';hint.textContent='Menukar kamera...';await openCamera();hint.textContent='Tekan MULA untuk ambil 1 gambar.'};
document.getElementById('retakeBtn').onclick=()=>{show('camera');hint.textContent='Tekan MULA untuk ambil semula.'};
document.getElementById('useBtn').onclick=()=>show('done');
document.getElementById('againBtn').onclick=prepare;
</script>
</body>
</html>
