<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111111">
<title>Kota Snap</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;min-height:100vh}
.wrap{max-width:720px;margin:auto;padding:18px 16px 30px}
h1{margin:4px 0 2px;font-size:30px;letter-spacing:2px}
.sub{color:#aaa;font-size:13px;margin-bottom:16px}
.card{background:#1c1c1c;border-radius:18px;padding:14px;margin-bottom:14px}
.video-wrap{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3}
video{width:100%;height:100%;object-fit:cover;display:block;transform:none}
.count{position:absolute;inset:0;display:grid;place-items:center;font-size:96px;font-weight:800;text-shadow:0 4px 20px #000;opacity:0}
.count.show{opacity:1}
button,select{width:100%;border:0;border-radius:13px;padding:15px 16px;font-size:17px;font-weight:700;margin-top:10px}
button{background:#fff;color:#111}
button.secondary{background:#333;color:#fff}
button.danger{background:#5b2020;color:#fff}
button:disabled{opacity:.4}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.filter-btn{padding:11px 4px;font-size:13px;margin:0;background:#333;color:#fff}
.filter-btn.active{background:#fff;color:#111}
canvas{width:100%;display:block;background:#fff;border-radius:10px}
.preview{background:#000;border-radius:14px;padding:10px}
.status{min-height:20px;color:#bbb;font-size:13px;text-align:center;margin-top:8px}
.small{font-size:12px;color:#888;line-height:1.4}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>KOTA SNAP</h1>
  <div class="sub">Kota Kopi • Receipt Photobooth</div>

  <div class="card" id="cameraCard">
    <div class="video-wrap">
      <video id="video" autoplay playsinline muted></video>
      <div id="count" class="count"></div>
    </div>
    <button id="startBtn">MULA SESI</button>
    <button id="switchBtn" class="secondary">TUKAR KAMERA</button>
    <div id="status" class="status">Kamera belum dimulakan.</div>
  </div>

  <div class="card hidden" id="editCard">
    <div class="small">Pilih filter untuk gambar anda:</div>
    <div class="filters" style="margin-top:10px">
      <button class="filter-btn active" data-filter="normal">NORMAL</button>
      <button class="filter-btn" data-filter="bw">B&W</button>
      <button class="filter-btn" data-filter="comic">COMIC</button>
      <button class="filter-btn" data-filter="contrast">HIGH CONTRAST</button>
    </div>

    <div class="preview" style="margin-top:12px">
      <canvas id="resultCanvas" width="384" height="576"></canvas>
    </div>

    <div class="row">
      <button id="retakeBtn" class="secondary">RETAKE</button>
      <button id="useBtn">GUNA FOTO</button>
    </div>
    <button id="downloadBtn" class="secondary hidden">SIMPAN GAMBAR</button>
    <button id="printBtn" class="hidden">PRINT</button>
    <div id="printStatus" class="status"></div>
  </div>
</div>

const video = document.getElementById('video');
const count = document.getElementById('count');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const switchBtn = document.getElementById('switchBtn');
const editCard = document.getElementById('editCard');
const resultCanvas = document.getElementById('resultCanvas');
const ctx = resultCanvas.getContext('2d');
let stream = null;
let facing = 'user';
let photoCanvas = document.createElement('canvas');
let currentFilter = 'normal';
let captured = false;

function status(t) { statusEl.textContent = t; }

async function openCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: {ideal: 1280}, height: {ideal: 960} },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    // No mirror: front camera is intentionally NOT flipped.
    video.style.transform = 'none';
    status('Kamera sedia.');
    return true;
  } catch(e) {
    status('Tak dapat akses kamera. Semak permission Safari.');
    return false;
  }
}

async function countdown() {
  for (const n of [3,2,1]) {
    count.textContent = n;
    count.classList.add('show');
    await new Promise(r=>setTimeout(r,700));
  }
  count.textContent = '📸';
  await new Promise(r=>setTimeout(r,250));
  count.classList.remove('show');
}

function capture() {
  const w = video.videoWidth || 1280, h = video.videoHeight || 960;
  photoCanvas.width = w; photoCanvas.height = h;
  const p = photoCanvas.getContext('2d');
  // Deliberately normal orientation, no horizontal flip.
  p.drawImage(video,0,0,w,h);
  captured = true;
  editCard.classList.remove('hidden');
  drawReceipt();
}

function applyFilter(source, filter) {
  const w=source.width,h=source.height;
  const c=document.createElement('canvas'); c.width=w;c.height=h;
  const x=c.getContext('2d');
  x.drawImage(source,0,0);
  if(filter==='normal') return c;
  const img=x.getImageData(0,0,w,h), d=img.data;
  for(let i=0;i<d.length;i+=4){
    let r=d[i],g=d[i+1],b=d[i+2];
    if(filter==='bw' || filter==='contrast' || filter==='comic'){
      let y=0.299*r+0.587*g+0.114*b;
      if(filter==='contrast') y=Math.max(0,Math.min(255,(y-128)*1.9+128));
      if(filter==='bw') y=y;
      if(filter==='comic') y = y>155 ? 255 : y<70 ? 0 : 95;
      d[i]=d[i+1]=d[i+2]=y;
    }
  }
  x.putImageData(img,0,0);
  if(filter==='comic'){
    x.globalCompositeOperation='multiply';
    x.filter='contrast(220%)';
    x.drawImage(c,0,0);
    x.globalCompositeOperation='source-over';
  }
  return c;
}

function drawReceipt(){
  const W=384,H=576;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#111';ctx.textAlign='center';
  ctx.font='800 27px Arial';ctx.fillText('KOTA KOPI',W/2,43);
  ctx.font='italic 700 19px Arial';ctx.fillText('KOTA SNAP',W/2,67);
  ctx.font='700 7px Arial';ctx.fillText('GOOD COFFEE  •  GOOD PEOPLE  •  GOOD DAYS',W/2,89);
  ctx.strokeStyle='#111';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(20,101);ctx.lineTo(364,101);ctx.stroke();

  const filtered=applyFilter(photoCanvas,currentFilter);
  const box={x:28,y:116,w:328,h:276};
  ctx.fillStyle='#eee';ctx.fillRect(box.x,box.y,box.w,box.h);
  const scale=Math.max(box.w/filtered.width,box.h/filtered.height);
  const dw=filtered.width*scale,dh=filtered.height*scale;
  const sx=(dw-box.w)/2,sy=(dh-box.h)/2;
  ctx.save();ctx.beginPath();ctx.rect(box.x,box.y,box.w,box.h);ctx.clip();
  ctx.drawImage(filtered,box.x-sx,box.y-sy,dw,dh);ctx.restore();
  ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.strokeRect(box.x,box.y,box.w,box.h);

  const now=new Date();
  const date=now.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase();
  const time=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}).toUpperCase();
  ctx.fillStyle='#111';ctx.textAlign='left';ctx.font='700 10px Arial';ctx.fillText(date,32,420);
  ctx.textAlign='right';ctx.fillText(time,352,420);
  ctx.setLineDash([2,3]);ctx.beginPath();ctx.moveTo(32,432);ctx.lineTo(352,432);ctx.stroke();ctx.setLineDash([]);

  ctx.textAlign='center';ctx.font='800 12px Arial';ctx.fillText('T H A N K   Y O U !',W/2,458);
  ctx.font='700 11px Arial';ctx.fillText('F O R   B E I N G   H E R E',W/2,476);
  ctx.font='26px Arial';ctx.fillText('♡',W/2,505);
  ctx.beginPath();ctx.moveTo(96,518);ctx.lineTo(288,518);ctx.stroke();
  ctx.font='700 7px Arial';ctx.fillText('KOTA KOPI',W/2,537);
  ctx.font='700 6px Arial';ctx.fillText('KOTA KUALA MUDA, KEDAH',W/2,550);
  ctx.font='700 6px Arial';ctx.fillText('COFFEE  •  PEOPLE  •  STORIES',W/2,563);
}

async function startSession(){
  if(!stream && !(await openCamera())) return;
  editCard.classList.add('hidden');
  startBtn.disabled=true;
  status('Bersedia...');
  await countdown();
  capture();
  startBtn.disabled=false;
  status('Gambar diambil. Pilih filter atau retake.');
}

startBtn.addEventListener('click',startSession);
switchBtn.addEventListener('click',async()=>{
  facing = facing==='user' ? 'environment' : 'user';
  await openCamera();
});
document.querySelectorAll('.filter-btn').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); currentFilter=btn.dataset.filter; drawReceipt();
}));
document.getElementById('retakeBtn').addEventListener('click',async()=>{
  editCard.classList.add('hidden'); await startSession();
});
document.getElementById('useBtn').addEventListener('click',()=>{
  document.getElementById('downloadBtn').classList.remove('hidden');
  document.getElementById('printBtn').classList.remove('hidden');
  document.getElementById('printStatus').textContent='Foto siap. Print terus dari Safari belum disambungkan ke Zywell.';
});
document.getElementById('downloadBtn').addEventListener('click',()=>{
  const a=document.createElement('a');a.download='kota-snap.png';a.href=resultCanvas.toDataURL('image/png');a.click();
});
document.getElementById('printBtn').addEventListener('click',()=>{
  document.getElementById('printStatus').textContent='Fungsi print Zywell akan disambungkan dalam langkah seterusnya.';
});

// Camera permission is requested only after the user taps MULA SESI.
</script>
