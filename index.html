<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Kota Snap</title>
<style>
:root{--bg:#090909;--card:#151515;--line:#2b2b2b;--text:#fff;--muted:#aaa;--accent:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button{font:inherit}
.app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.screen{display:none;flex:1;min-height:0;overflow:hidden}
.screen.active{display:flex}
.center{align-items:center;justify-content:center;flex-direction:column;padding:24px}
.brand{font-size:clamp(34px,7vw,62px);font-weight:900;letter-spacing:4px}
.sub{margin-top:8px;color:var(--muted);letter-spacing:3px;font-size:12px}
.primary{margin-top:36px;border:0;border-radius:18px;background:#fff;color:#000;padding:18px 44px;font-size:18px;font-weight:900;letter-spacing:1px}
.secondary{border:1px solid #555;background:#181818;color:#fff;border-radius:14px;padding:14px 22px;font-weight:800}
.camera-screen{position:relative;flex-direction:column}
#video{width:100%;height:100%;object-fit:cover;display:block;transform:none;background:#000}
.cam-top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:18px 20px;background:linear-gradient(#000b,transparent);z-index:2}
.pill{background:#0009;border:1px solid #ffffff33;border-radius:999px;padding:8px 13px;font-size:12px;font-weight:800}
.capture-btn{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);width:82px;height:82px;border-radius:50%;border:7px solid #fff;background:#111;box-shadow:0 0 0 5px #0008;z-index:3}
.countdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0004;z-index:5;font-size:min(25vw,180px);font-weight:1000;text-shadow:0 4px 20px #000}
.preview-screen,.style-screen,.final-screen{flex-direction:column;align-items:center;justify-content:center;padding:14px;gap:12px}
.preview-wrap{height:min(67vh,620px);max-width:92vw;aspect-ratio:3/4;background:#111;border:1px solid #333;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#previewImg{max-width:100%;max-height:100%;display:block;object-fit:contain}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.title{font-size:22px;font-weight:900;letter-spacing:1px}
.style-grid{width:min(920px,94vw);display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.style-card{border:1px solid #333;background:var(--card);border-radius:16px;padding:10px;text-align:left;color:#fff}
.style-card.selected{border:2px solid #fff}
.style-card canvas{width:100%;aspect-ratio:3/4;background:#fff;border-radius:10px;display:block}
.style-name{font-weight:900;margin:9px 2px 3px}
.style-note{font-size:11px;color:#999;margin:0 2px}
#finalCanvas{height:min(76vh,760px);max-width:92vw;object-fit:contain;background:#fff;border-radius:12px}
.small{font-size:11px;color:#999;text-align:center;max-width:680px}
.notice{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#111;border:1px solid #333;padding:9px 14px;border-radius:999px;font-size:11px;color:#bbb;z-index:20;display:none}
@media(max-width:700px){.style-grid{gap:7px}.style-card{padding:7px}.style-name{font-size:13px}.style-note{font-size:9px}.preview-wrap{height:61vh}}
</style>
</head>
<body>
<div class="app">
  <section id="home" class="screen active center">
    <div class="brand">KOTA SNAP</div>
    <div class="sub">KOTA KOPI • PHOTOBOOTH</div>
    <button class="primary" id="startBtn">MULA SESI</button>
  </section>

  <section id="camera" class="screen camera-screen">
    <div class="cam-top">
      <div class="pill">KOTA SNAP</div><div class="pill">1 FOTO</div>
    </div>
    <video id="video" autoplay playsinline muted></video>
    <div id="countdown" class="countdown"></div>
    <button id="captureBtn" class="capture-btn" aria-label="Ambil gambar"></button>
  </section>

  <section id="preview" class="screen preview-screen">
    <div class="title">SEMAK FOTO</div>
    <div class="preview-wrap"><img id="previewImg" alt="Pratonton"></div>
    <div class="actions">
      <button class="secondary" id="retakeBtn">RETAKE</button>
      <button class="primary" style="margin:0" id="useBtn">GUNA FOTO</button>
    </div>
  </section>

  <section id="styles" class="screen style-screen">
    <div class="title">PILIH STYLE</div>
    <div class="style-grid">
      <button class="style-card" data-style="cartoon">
        <canvas id="thumbCartoon"></canvas>
        <div class="style-name">🎨 RECEIPT CARTOON</div>
        <p class="style-note">Kartun ink hitam putih.</p>
      </button>
      <button class="style-card" data-style="line">
        <canvas id="thumbLine"></canvas>
        <div class="style-name">✏️ LINE ART</div>
        <p class="style-note">Outline bersih — boleh colour.</p>
      </button>
      <button class="style-card" data-style="retro">
        <canvas id="thumbRetro"></canvas>
        <div class="style-name">🖤 RETRO B&W</div>
        <p class="style-note">Hitam putih thermal.</p>
      </button>
    </div>
    <div class="actions">
      <button class="secondary" id="backPreviewBtn">KEMBALI</button>
    </div>
    <div class="small">Filter dibuat terus dalam iPad • 100% local • tiada API / bayaran.</div>
  </section>

  <section id="final" class="screen final-screen">
    <div class="title" id="finalTitle">KOTA SNAP</div>
    <canvas id="finalCanvas" width="384" height="760"></canvas>
    <div class="actions">
      <button class="secondary" id="backStyleBtn">TUKAR STYLE</button>
      <button class="primary" style="margin:0" id="printBtn">CETAK</button>
    </div>
    <div class="small" id="printNote">Cetak belum disambungkan dalam versi ujian ini.</div>
  </section>
</div>
<div id="notice" class="notice"></div>

<script>
const screens = [...document.querySelectorAll('.screen')];
const video = document.getElementById('video');
const countdown = document.getElementById('countdown');
const previewImg = document.getElementById('previewImg');
const finalCanvas = document.getElementById('finalCanvas');
let stream=null, rawImage=null, selectedStyle='line';

function show(id){
  screens.forEach(s=>s.classList.toggle('active',s.id===id));
}
function notice(t){
  const n=document.getElementById('notice'); n.textContent=t; n.style.display='block';
  clearTimeout(notice.t); notice.t=setTimeout(()=>n.style.display='none',2200);
}
async function startCamera(){
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'user'},width:{ideal:1280},height:{ideal:960}},
      audio:false
    });
    video.srcObject=stream;
    await video.play();
    show('camera');
  }catch(e){
    notice('Kamera tidak dapat dibuka. Pastikan Safari beri izin kamera.');
  }
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function takePhoto(){
  countdown.style.display='flex';
  for(const n of [3,2,1]){
    countdown.textContent=n; await sleep(700);
  }
  countdown.textContent='';
  await sleep(150);
  const c=document.createElement('canvas');
  const w=video.videoWidth||1280, h=video.videoHeight||960;
  c.width=w;c.height=h;
  const ctx=c.getContext('2d');
  // No mirror: draw exactly as received from camera.
  ctx.drawImage(video,0,0,w,h);
  rawImage=c.toDataURL('image/jpeg',.92);
  countdown.style.display='none';
  previewImg.src=rawImage;
  show('preview');
}
function imageToCanvas(src, effect){
  const c=document.createElement('canvas');
  const max=1200;
  const scale=Math.min(1,max/src.width);
  c.width=Math.max(1,Math.round(src.width*scale));
  c.height=Math.max(1,Math.round(src.height*scale));
  const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(src,0,0,c.width,c.height);

  const W=c.width,H=c.height,N=W*H;
  const original=ctx.getImageData(0,0,W,H);
  const d=original.data;
  const gray=new Float32Array(N);

  for(let i=0,p=0;i<N;i++,p+=4)
    gray[i]=0.299*d[p]+0.587*d[p+1]+0.114*d[p+2];

  // Edge-preserving-ish smoothing: repeated 3x3 weighted blur.
  function smooth(input){
    const out=new Float32Array(N);
    for(let y=0;y<H;y++){
      for(let x=0;x<W;x++){
        let sum=0,ws=0, center=input[y*W+x];
        for(let yy=-1;yy<=1;yy++){
          const cy=Math.max(0,Math.min(H-1,y+yy));
          for(let xx=-1;xx<=1;xx++){
            const cx=Math.max(0,Math.min(W-1,x+xx));
            const v=input[cy*W+cx];
            const dist=Math.abs(v-center);
            const w=dist<18 ? 1.8 : dist<35 ? .65 : .18;
            sum+=v*w; ws+=w;
          }
        }
        out[y*W+x]=sum/ws;
      }
    }
    return out;
  }

  const soft=smooth(smooth(gray));

  // Sobel gradient.
  const mag=new Float32Array(N);
  for(let y=1;y<H-1;y++){
    for(let x=1;x<W-1;x++){
      const i=y*W+x;
      const a=soft[i-W-1],b=soft[i-W],cc=soft[i-W+1];
      const e=soft[i-1],g=soft[i+1];
      const h=soft[i+W-1],j=soft[i+W],k=soft[i+W+1];
      const gx=-a-2*e-h+cc+2*g+k;
      const gy=-a-2*b-cc+h+2*j+k;
      mag[i]=Math.sqrt(gx*gx+gy*gy);
    }
  }

  // Robust percentile thresholds.
  let samples=[];
  for(let i=0;i<N;i+=Math.max(1,Math.floor(N/5000))) samples.push(mag[i]);
  samples.sort((a,b)=>a-b);
  const pct=q=>samples[Math.floor((samples.length-1)*q)]||0;
  const strong=Math.max(30,pct(.82));
  const weak=Math.max(16,strong*.48);

  const out=ctx.createImageData(W,H), o=out.data;

  if(effect==='line'){
    // Clean colouring-page look: white paper + selective ink lines.
    // Keep mid-tone facial/clothing contours without filling large areas.
    for(let y=0;y<H;y++){
      for(let x=0;x<W;x++){
        const i=y*W+x,p=i*4;
        let isEdge=mag[i]>strong;
        if(!isEdge && mag[i]>weak){
          // Keep dark structural contours; reject flat dark regions.
          const g=soft[i];
          isEdge = g<125 && mag[i]>weak*1.22;
        }
        const v=isEdge?18:252;
        o[p]=o[p+1]=o[p+2]=v;o[p+3]=255;
      }
    }
    // One-pixel cleanup: remove isolated black specks.
    for(let y=1;y<H-1;y++){
      for(let x=1;x<W-1;x++){
        const p=(y*W+x)*4;
        if(o[p]<100){
          let n=0;
          for(let yy=-1;yy<=1;yy++) for(let xx=-1;xx<=1;xx++)
            if(o[((y+yy)*W+(x+xx))*4]<100)n++;
          if(n<=2)o[p]=o[p+1]=o[p+2]=252;
        }
      }
    }
    ctx.putImageData(out,0,0);
    return c;
  }

  if(effect==='retro'){
    // Classic receipt look: grayscale + ordered dithering.
    const mat=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      const i=y*W+x,p=i*4;
      let g=soft[i];
      // Slight contrast boost.
      g=Math.max(0,Math.min(255,(g-128)*1.22+128));
      const threshold=mat[y&3][x&3]*16;
      const v=g>threshold?255:0;
      o[p]=o[p+1]=o[p+2]=v;o[p+3]=255;
    }
    ctx.putImageData(out,0,0);
    return c;
  }

  // RECEIPT CARTOON: posterized ink illustration.
  // Smooth first, then simplify tones and add clean outlines.
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const i=y*W+x,p=i*4;
    let g=soft[i];
    // contrast
    g=Math.max(0,Math.min(255,(g-128)*1.18+128));
    let v;
    if(mag[i]>strong*1.05) v=10;
    else if(g<70) v=28;
    else if(g<115) v=82;
    else if(g<175) v=170;
    else v=248;
    if(g>225 && mag[i]<weak) v=255;
    o[p]=o[p+1]=o[p+2]=v;o[p+3]=255;
  }
  ctx.putImageData(out,0,0);
  return c;
}
function loadImage(data){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=data})}
async function renderThumbs(){
  if(!rawImage)return;
  const im=await loadImage(rawImage);
  for(const [id,fx] of [['thumbCartoon','cartoon'],['thumbLine','line'],['thumbRetro','retro']]){
    const src=imageToCanvas(im,fx), t=document.getElementById(id),ctx=t.getContext('2d');
    t.width=src.width;t.height=src.height;ctx.drawImage(src,0,0);
  }
}
function drawTemplate(photoCanvas, styleName){
  const c=finalCanvas,ctx=c.getContext('2d'),W=c.width,H=c.height;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#111';ctx.textAlign='center';
  ctx.font='900 24px Arial';ctx.fillText('KOTA KOPI',W/2,38);
  ctx.font='900 15px Arial';ctx.fillText('KOTA SNAP',W/2,61);
  ctx.font='10px Arial';ctx.fillText('COFFEE • PEOPLE • STORIES',W/2,79);
  ctx.fillStyle='#111';ctx.fillRect(16,94,W-32,520);
  const pad=22, pw=W-44, ph=492;
  const s=Math.min(pw/photoCanvas.width,ph/photoCanvas.height);
  const dw=photoCanvas.width*s,dh=photoCanvas.height*s;
  ctx.drawImage(photoCanvas,pad+(pw-dw)/2,108+(ph-dh)/2,dw,dh);
  ctx.fillStyle='#111';ctx.font='11px Arial';
  const now=new Date();
  const date=now.toLocaleDateString('ms-MY',{day:'2-digit',month:'2-digit',year:'numeric'});
  const time=now.toLocaleTimeString('ms-MY',{hour:'2-digit',minute:'2-digit'});
  ctx.fillText(date+'  •  '+time,W/2,645);
  ctx.font='900 16px Arial';ctx.fillText('THANK YOU!',W/2,676);
  ctx.font='11px Arial';ctx.fillText('FOR BEING HERE ♥',W/2,696);
  ctx.font='9px Arial';ctx.fillText('Kota Kopi • Kota Kuala Muda, Kedah',W/2,731);
  ctx.font='8px Arial';ctx.fillText(styleName.toUpperCase(),W/2,748);
}
async function chooseStyle(style){
  selectedStyle=style;
  document.querySelectorAll('.style-card').forEach(b=>b.classList.toggle('selected',b.dataset.style===style));
  const im=await loadImage(rawImage);
  const fx=style==='cartoon'?'cartoon':style;
  const processed=imageToCanvas(im,fx);
  const names={cartoon:'RECEIPT CARTOON',line:'LINE ART',retro:'RETRO B&W'};
  drawTemplate(processed,names[style]);
  document.getElementById('finalTitle').textContent=names[style];
  show('final');
}
document.getElementById('startBtn').onclick=startCamera;
document.getElementById('captureBtn').onclick=takePhoto;
document.getElementById('retakeBtn').onclick=()=>show('camera');
document.getElementById('useBtn').onclick=async()=>{show('styles');await renderThumbs()};
document.getElementById('backPreviewBtn').onclick=()=>show('preview');
document.getElementById('backStyleBtn').onclick=()=>show('styles');
document.querySelectorAll('.style-card').forEach(b=>b.onclick=()=>chooseStyle(b.dataset.style));
document.getElementById('printBtn').onclick=()=>notice('CETAK belum disambungkan — Zywell akan disambung kemudian.');

window.addEventListener('beforeunload',()=>{if(stream)stream.getTracks().forEach(t=>t.stop())});
</script>
</body>
</html>
