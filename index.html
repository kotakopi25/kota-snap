  function drawRest(){
    const photoY=logoH+gap;

    // Photo frame
    x.fillStyle="#fff";
    x.fillRect(side,photoY,photoW,photoH);
    x.lineWidth=4;
    x.strokeStyle="#111";
    x.strokeRect(side+1,photoY+1,photoW-2,photoH-2);

    // Crop photo to fill the frame
    const srcRatio=photo.width/photo.height;
    const dstRatio=photoW/photoH;
    let sx=0,sy=0,sw=photo.width,sh=photo.height;
    if(srcRatio>dstRatio){
      sw=Math.round(photo.height*dstRatio);
      sx=Math.round((photo.width-sw)/2);
    }else{
      sh=Math.round(photo.width/dstRatio);
      sy=Math.round((photo.height-sh)/2);
    }

    // Preview photo in normal grayscale only.
    // Keep all shades of grey; do NOT threshold into pure black/white.
    const pw=photoW-8, ph=photoH-8;
    const temp=document.createElement("canvas");
    temp.width=pw; temp.height=ph;
    const tx=temp.getContext("2d");
    tx.drawImage(photo,sx,sy,sw,sh,0,0,pw,ph);

    const img=tx.getImageData(0,0,pw,ph);
    const d=img.data;
    for(let i=0;i<d.length;i+=4){
      const gray=Math.round((0.299*d[i])+(0.587*d[i+1])+(0.114*d[i+2]));
      d[i]=gray;
      d[i+1]=gray;
      d[i+2]=gray;
      d[i+3]=255;
    }
    tx.putImageData(img,0,0);
    x.drawImage(temp,side+4,photoY+4);

    // Re-draw border over photo
    x.lineWidth=4;
    x.strokeStyle="#111";
    x.strokeRect(side+1,photoY+1,photoW-2,photoH-2);

    const now=new Date();
    const months=["JANUARI","FEBRUARI","MAC","APRIL","MEI","JUN","JULAI","OGOS","SEPTEMBER","OKTOBER","NOVEMBER","DISEMBER"];
    const day=String(now.getDate()).padStart(2,"0");
    const month=months[now.getMonth()];
    const year=now.getFullYear();
    let hr=now.getHours();
    const min=String(now.getMinutes()).padStart(2,"0");
    const ampm=hr>=12?"PM":"AM";
    hr=hr%12||12;
    const time=hr+"."+min+" "+ampm;

    const base=photoY+photoH;

    x.fillStyle="#111";
    x.textAlign="center";
    x.font="12px Arial";
    x.fillText(day+" "+month+" "+year+" | "+time,W/2,base+34);

    x.font="12px Arial";
    x.fillText("TERIMA KASIH  🤝🤝",W/2,base+66);

    x.font="12px Arial";
    x.fillText("TIKTOK : @kotakopi__",W/2,base+104);

    x.font="12px Arial";
    x.fillText("KOTA KOPI",W/2,base+146);

    x.font="12px Arial";
    x.fillText("📍 PEKAN KOTA KUALA MUDA",W/2,base+178);
  }
}
async function resetToCamera(){ $("status").textContent=""; await openCam(); }
$("pinBtn").onclick=login;$("pin").onkeydown=e=>{if(e.key==="Enter")login()};$("start").onclick=snap;$("again").onclick=resetToCamera;$("print").onclick=async()=>{
  const canvas=$("canvas");
  canvas.toBlob(async(blob)=>{
    if(!blob){$("status").textContent="Gagal menyediakan gambar untuk print.";return;}
    const file=new File([blob],"kota-snap.png",{type:"image/png"});
    try{
      if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:"Kota Snap"});
      }else if(navigator.share){
        await navigator.share({title:"Kota Snap",text:"Kota Snap"});
      }else{
        $("status").textContent="Share tidak disokong pada browser ini.";
      }
    }catch(e){
      if(e && e.name!=="AbortError") $("status").textContent="Share dibatalkan atau gagal.";
    }
  },"image/png");
};show("doneScreen")};$("done").onclick=()=>{pinNow="";$("pin").value="";show("pinScreen");};
